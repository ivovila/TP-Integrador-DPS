# Activar con --spring.profiles.active=demo,nvidia. La key queda solo en el entorno del proceso.
certiflow.assistant.provider=spring-ai
certiflow.assistant.base-url=https://integrate.api.nvidia.com/v1
certiflow.assistant.api-key=${NVIDIA_API_KEY:}
certiflow.assistant.model=${NVIDIA_MODEL:google/gemma-4-31b-it}
certiflow.assistant.prompt-version=${CERTIFLOW_ASSISTANT_PROMPT_VERSION:v1}
certiflow.assistant.timeout=${CERTIFLOW_ASSISTANT_TIMEOUT:PT60S}

# Gemma permite respuesta directa para no consumir la salida en razonamiento.
certiflow.assistant.enable-thinking=${CERTIFLOW_ASSISTANT_ENABLE_THINKING:false}
