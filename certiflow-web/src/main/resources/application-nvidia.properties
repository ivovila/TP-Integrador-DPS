# Activar con --spring.profiles.active=demo,nvidia. La key queda solo en el entorno del proceso.
certiflow.assistant.provider=spring-ai
certiflow.assistant.base-url=https://integrate.api.nvidia.com/v1
certiflow.assistant.api-key=${NVIDIA_API_KEY:}
# Nemotron 3.5 Super pasó la revisión de punta a punta en segundos (docs/validation/2026-11-08-nvidia-first-review.json).
certiflow.assistant.model=${NVIDIA_MODEL:nvidia/nemotron-3.5-super-vl-120b-a12b}
# v2 midió mejor que v1 en el harness (certiflow-harness/results/v2/comparison-with-v1.md).
certiflow.assistant.prompt-version=${CERTIFLOW_ASSISTANT_PROMPT_VERSION:v2}

# El endpoint gratuito encola los pedidos de los modelos más pedidos: Mistral Large 4 llegó a tardar 208 s.
# NVCF-POLL-SECONDS hace que NVIDIA espere la respuesta en vez de devolver 202, que el cliente no sigue.
certiflow.assistant.timeout=${CERTIFLOW_ASSISTANT_TIMEOUT:PT300S}
certiflow.assistant.headers={"NVCF-POLL-SECONDS":"300"}

# Lo que cada modelo acepta de más. Nemotron razona aparte (reasoning_content) y no necesita nada; Mistral Large 4
# contesta directo con {"reasoning_effort":"none"} y Gemma con {"chat_template_kwargs":{"enable_thinking":false}}.
certiflow.assistant.extra-body=${CERTIFLOW_ASSISTANT_EXTRA_BODY:{}}
