# Las mismas claves que la aplicación (perfil nvidia). Cada valor se cambia con la variable de entorno indicada.
# Por defecto corre contra el stub: sin red ni key.
certiflow.assistant.provider=${HARNESS_PROVIDER:stub}
certiflow.assistant.base-url=https://integrate.api.nvidia.com/v1
certiflow.assistant.api-key=${NVIDIA_API_KEY:}
certiflow.assistant.model=${NVIDIA_MODEL:nvidia/nemotron-3.5-super-vl-120b-a12b}
certiflow.assistant.prompt-version=${HARNESS_PROMPT_VERSION:v1}
certiflow.assistant.timeout=${CERTIFLOW_ASSISTANT_TIMEOUT:PT300S}
certiflow.assistant.headers={"NVCF-POLL-SECONDS":"300"}
certiflow.assistant.extra-body=${CERTIFLOW_ASSISTANT_EXTRA_BODY:{}}

# Cada caso corre varias veces: un modelo no responde siempre igual.
harness.runs=${HARNESS_RUNS:5}
harness.results=${HARNESS_RESULTS:results}
